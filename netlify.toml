[build]
  command = "npm run build"
  publish = "dist"
  # The consultation form's two emails. `submission-created.js` in here is
  # invoked automatically by Netlify on every form submission — the filename is
  # the trigger, so there is no webhook to configure and nothing in the
  # dashboard that can be switched off by accident.
  functions = "netlify/functions"

[functions]
  # esbuild reads the TypeScript import of src/data/business.ts directly, which
  # is what lets `bookingUrl` have exactly one home in this repo instead of
  # being duplicated into an environment variable.
  node_bundler = "esbuild"

[build.environment]
  # Pinned to the Node version actually on PATH locally (/usr/local/bin/node
  # v24.18.0), which also matches Netlify's build image default (Node 24) as
  # of 2026-07. Netlify resolves this exact patch via nvm at build time.
  NODE_VERSION = "24.18.0"

# The four service sub-pages were removed 2026-08-19 (post-Meeting-4 pass,
# Task 1) and consolidated into one Services overview. Permanent redirects so
# any inbound link, bookmark, or indexed search result lands on /services
# instead of a 404.
[[redirects]]
  from = "/services/drapery"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/services/blinds-shades"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/services/upholstery"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/services/soft-furnishings"
  to = "/services/"
  status = 301

# Blinds landing page and Design Journal saved for v2 (COPY-PASS-V1, Task 1,
# 2026-10-08). Routes live under src/pages/_disabled/ behind FLAGS in
# src/config/flags.ts. Delete the matching block here when either returns.
[[redirects]]
  from = "/blinds"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/blinds/"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/journal"
  to = "/"
  status = 301

[[redirects]]
  from = "/journal/"
  to = "/"
  status = 301

[[redirects]]
  from = "/journal/*"
  to = "/"
  status = 301

# Redirect targets end in a slash (2026-10-14, audit): Netlify serves
# /services/ and 301s /services to it, so a target without the slash cost a
# second redirect.

# Security headers (2026-10-14, audit). Before this only HSTS was set (by
# Netlify). These four change nothing visible: no MIME sniffing, no framing
# of the site by other sites, referrers trimmed to the origin cross-site, and
# no camera/microphone/location access. A Content-Security-Policy is not set
# yet; it needs testing against the inline JSON-LD and Astro's scripts first.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"


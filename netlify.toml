[build]
  command = "npm run build"
  publish = "dist"
  # The consultation form's two emails. `submission-created.js` in here is
  # invoked automatically by Netlify on every form submission — the filename is
  # the trigger, so there is no webhook to configure and nothing in the
  # dashboard that can be switched off by accident.
  functions = "netlify/functions"

[functions]
  # esbuild reads the TypeScript import of src/data/business.ts directly, which
  # is what lets `bookingUrl` have exactly one home in this repo instead of
  # being duplicated into an environment variable.
  node_bundler = "esbuild"

[build.environment]
  # Pinned to the Node version actually on PATH locally (/usr/local/bin/node
  # v24.18.0), which also matches Netlify's build image default (Node 24) as
  # of 2026-07. Netlify resolves this exact patch via nvm at build time.
  NODE_VERSION = "24.18.0"

# The four service sub-pages were removed 2026-08-19 (post-Meeting-4 pass,
# Task 1) and consolidated into one Services overview. Permanent redirects so
# any inbound link, bookmark, or indexed search result lands on /services
# instead of a 404.
[[redirects]]
  from = "/services/drapery"
  to = "/services"
  status = 301

[[redirects]]
  from = "/services/blinds-shades"
  to = "/services"
  status = 301

[[redirects]]
  from = "/services/upholstery"
  to = "/services"
  status = 301

[[redirects]]
  from = "/services/soft-furnishings"
  to = "/services"
  status = 301
